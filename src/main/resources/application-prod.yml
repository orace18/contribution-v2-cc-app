springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

firebase:
  auth:
    enabled: ${FIREBASE_AUTH_ENABLED:true}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase/firebase-service-account-prod.json}
  project-id: ${FIREBASE_PROJECT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ccapp: ${LOG_LEVEL_CCAPP:INFO}
  file:
    name: ${LOG_FILE:logs/cc-app-backend.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_ROLLING_PATTERN:logs/archive/cc-app-backend.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${LOG_MAX_FILE_SIZE:20MB}
      max-history: ${LOG_MAX_HISTORY_DAYS:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:2GB}
      clean-history-on-start: true
