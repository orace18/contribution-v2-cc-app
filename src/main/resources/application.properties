spring.application.name=cc-app-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cc_app_db}
spring.datasource.username=${DB_USERNAME:cc_app}
spring.datasource.password=${DB_PASSWORD:cc_app_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

firebase.auth.enabled=${FIREBASE_AUTH_ENABLED:false}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

security.internal-api-key=${INTERNAL_API_KEY:}

identity.refresh-token.ttl-hours=${REFRESH_TOKEN_TTL_HOURS:720}

psp.jawupay.hmac-secret=${JAWUPAY_HMAC_SECRET:change-me}
psp.jawupay.replay-window-seconds=${JAWUPAY_REPLAY_WINDOW_SECONDS:300}
psp.jawupay.callback-rate-limit-per-minute=${JAWUPAY_RATE_LIMIT_PER_MINUTE:60}

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ccapp=${LOG_LEVEL_CCAPP:INFO}
