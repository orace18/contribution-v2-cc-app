spring.profiles.active=@spring.profiles.active@
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ----------------------------------------
# FIREBASE AUTH (REAL MODE DEFAULT)
# ----------------------------------------
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase/firebase-service-account-dev.json}
firebase.project-id=${FIREBASE_PROJECT_ID:jawupay-bbc9f}
security.internal-api-key=${INTERNAL_API_KEY:internal-api-key-dev}
psp.jawupay.hmac-secret=${JAWUPAY_HMAC_SECRET:jawupay-hmac-dev-secret}
# ----------------------------------------
# FIREBASE PROPERTIES
# ----------------------------------------
firebase.service.token.file=firebase-service-clubchretien/firebase-service-account-${spring.profiles.active}.json
firebase.config.url=https://jawupay-bbc9f.firebaseio.com
# ----------------------------------------
# LOGGING PROPERTIES
# ----------------------------------------
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.com.owomi=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.hibernate.SQL=info
# ----------------------------------------
# MONITORING PROPERTIES prometheus
# ----------------------------------------
management.security.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
opentracing.jaeger.http-sender.url=${JAEGER_SENDER_URL}/api/traces
opentracing.jaeger.log-spans=false
# ----------------------------------------
# PAGEABLE PROPERTIES
# ----------------------------------------eFelIyfDEJMnFUyNRnbosGytBeIRsOTPi7T6fTJyp
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.max-page-size=2000
spring.data.web.pageable.prefix=
spring.data.web.pageable.qualifier-delimiter=_
spring.main.allow-bean-definition-overriding=true
# application.properties
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# ----------------------------------------
# HIKARI PROPERTIES
# ----------------------------------------
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HikariCorePool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# ----------------------------------------
# DOCS PROPERTIES
# ----------------------------------------
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false

# ----------------------------------------
# ADMIN BACK OFFICE
# ----------------------------------------
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@platform.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:admin-bootstrap-dev-password}
admin.jwt.secret=${ADMIN_JWT_SECRET:admin-jwt-dev-secret}
admin.jwt.access-token-ttl-minutes=${ADMIN_JWT_ACCESS_TTL_MINUTES:480}
admin.jwt.challenge-token-ttl-minutes=${ADMIN_JWT_CHALLENGE_TTL_MINUTES:10}
admin.totp.issuer=${ADMIN_TOTP_ISSUER:CC-APP Back Office}
admin.invitation.default-expiration-hours=${ADMIN_INVITATION_EXP_HOURS:72}
admin.invitation.base-url=${ADMIN_INVITATION_BASE_URL:https://backoffice.platform.com/activate}

# ----------------------------------------
# MEDIA / MINIO
# ----------------------------------------
media.storage.endpoint=${MEDIA_STORAGE_ENDPOINT:${MINIO_URL:http://localhost:9000}}
media.storage.region=${MEDIA_STORAGE_REGION:us-east-1}
media.storage.access-key=${MEDIA_STORAGE_ACCESS_KEY:${MINIO_USER:minioadmin}}
media.storage.secret-key=${MEDIA_STORAGE_SECRET_KEY:${MINIO_PASSWORD:minioadmin}}
media.storage.path-style=${MEDIA_STORAGE_PATH_STYLE:true}
media.bucket.public=${MEDIA_BUCKET_PUBLIC:${MINIO_BUCKET_NAME:cc-media-public}}
media.bucket.private=${MEDIA_BUCKET_PRIVATE:cc-media-private}
media.bucket.kyc=${MEDIA_BUCKET_KYC:cc-media-kyc}
media.bucket.auto-create=${MEDIA_BUCKET_AUTO_CREATE:true}
media.upload-url-ttl-minutes=${MEDIA_UPLOAD_URL_TTL_MINUTES:15}
media.download-url-ttl-minutes=${MEDIA_DOWNLOAD_URL_TTL_MINUTES:15}
media.max-size-bytes=${MEDIA_MAX_SIZE_BYTES:10485760}
media.storage.startup-strict=${MEDIA_STORAGE_STARTUP_STRICT:false}

# ----------------------------------------
# CORS
# ----------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://backoffice.platform.com,https://back-office-cc-app.vercel.app}

# ----------------------------------------
# MLM WEEKLY GROUP BONUS
# ----------------------------------------
mlm.group-bonus.currency=${MLM_GROUP_BONUS_CURRENCY:XOF}
mlm.group-bonus.cron=${MLM_GROUP_BONUS_CRON:0 55 23 * * SUN}
mlm.group-bonus.zone=${MLM_GROUP_BONUS_ZONE:Africa/Porto-Novo}
mlm.analytics.zone=${MLM_ANALYTICS_ZONE:Africa/Porto-Novo}
mlm.analytics.active-window-days=${MLM_ANALYTICS_ACTIVE_WINDOW_DAYS:30}
mlm.analytics.snapshot.cron=${MLM_ANALYTICS_SNAPSHOT_CRON:0 59 23 * * SUN}
mlm.query.max-level=${MLM_QUERY_MAX_LEVEL:20}
mlm.query.max-downline-members=${MLM_QUERY_MAX_DOWNLINE_MEMBERS:5000}
mlm.monitoring.weekly-bonus.max-stale-days=${MLM_WEEKLY_BONUS_MAX_STALE_DAYS:8}
mlm.monitoring.commission-spike.lookback-hours=${MLM_COMMISSION_SPIKE_LOOKBACK_HOURS:24}
mlm.monitoring.commission-spike.threshold=${MLM_COMMISSION_SPIKE_THRESHOLD:10000}
commission.payout.tax-rate-percent=${COMMISSION_PAYOUT_TAX_RATE_PERCENT:10.0}

# ----------------------------------------
# EXTERNALIZED SENSITIVE CONFIG
# ----------------------------------------
jwt.secret=${JWT_SECRET}
partner.api.key=${PARTNER_API_KEY:partner-api-key-dev}
spring.mail.password=${MAIL_PASSWORD:mail-dev-password}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
dsn=${SENTRY_DSN}
