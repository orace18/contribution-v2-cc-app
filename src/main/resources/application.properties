spring.profiles.active=@spring.profiles.active@
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V70 was applied to DB with an earlier version of the script, then the file was modified.
# We renamed it to V71 (safe re-run). This pattern lets Flyway ignore V70 being absent locally.
spring.flyway.ignore-migration-patterns=*:missing
# ----------------------------------------
# FIREBASE AUTH / PUSH
# ----------------------------------------
firebase.auth.enabled=${FIREBASE_AUTH_ENABLED:true}
firebase.push.enabled=${FIREBASE_PUSH_ENABLED:${FIREBASE_AUTH_ENABLED:false}}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.use-emulator=${FIREBASE_USE_EMULATOR:false}
firebase.emulator.host=${FIREBASE_AUTH_EMULATOR_HOST:localhost:9099}
firebase.dev-bypass.mock-user.enabled=${FIREBASE_DEV_BYPASS_MOCK_USER_ENABLED:false}
firebase.dev-bypass.uid=${FIREBASE_DEV_BYPASS_UID:}
firebase.dev-bypass.email=${FIREBASE_DEV_BYPASS_EMAIL:}
firebase.dev-bypass.user-id=${FIREBASE_DEV_BYPASS_USER_ID:}
firebase.dev-bypass.account-holder-id=${FIREBASE_DEV_BYPASS_ACCOUNT_HOLDER_ID:}
firebase.push.retry.max-attempts=${FIREBASE_PUSH_RETRY_MAX_ATTEMPTS:3}
firebase.push.retry.initial-delay-ms=${FIREBASE_PUSH_RETRY_INITIAL_DELAY_MS:500}
security.internal-api-key=${INTERNAL_API_KEY:internal-api-key-dev}
psp.jawupay.hmac-secret=${JAWUPAY_HMAC_SECRET:jawupay-hmac-dev-secret}
psp.jawupay.webhook.hmac-secret=${JAWUPAY_WEBHOOK_HMAC_SECRET:${JAWUPAY_HMAC_SECRET:jawupay-hmac-dev-secret}}
psp.jawupay.mock-enabled=${JAWUPAY_MOCK_ENABLED:false}
psp.jawupay.base-url=${JAWUPAY_BASE_URL:https://api-gateway-dev.jawupay.com/orchestrator-service}
psp.jawupay.api-key=${JAWUPAY_API_KEY:}
psp.jawupay.http.connect-timeout-ms=${JAWUPAY_HTTP_CONNECT_TIMEOUT_MS:5000}
psp.jawupay.http.read-timeout-ms=${JAWUPAY_HTTP_READ_TIMEOUT_MS:10000}
psp.jawupay.http.safe-retry.max-attempts=${JAWUPAY_HTTP_SAFE_RETRY_MAX_ATTEMPTS:3}
psp.jawupay.http.safe-retry.initial-delay-ms=${JAWUPAY_HTTP_SAFE_RETRY_INITIAL_DELAY_MS:500}
psp.jawupay.webhook.allowedIps=${JAWUPAY_WEBHOOK_ALLOWED_IPS:}
# ----------------------------------------
# LOGGING PROPERTIES
# ----------------------------------------
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.com.owomi=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.hibernate.SQL=WARN
# ----------------------------------------
# MONITORING PROPERTIES prometheus
# ----------------------------------------
management.security.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
opentracing.jaeger.http-sender.url=${JAEGER_SENDER_URL}/api/traces
opentracing.jaeger.log-spans=false
# ----------------------------------------
# PAGEABLE PROPERTIES
# ----------------------------------------eFelIyfDEJMnFUyNRnbosGytBeIRsOTPi7T6fTJyp
spring.data.web.pageable.size-parameter=size
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.one-indexed-parameters=false
spring.data.web.pageable.max-page-size=2000
spring.data.web.pageable.prefix=
spring.data.web.pageable.qualifier-delimiter=_
spring.main.allow-bean-definition-overriding=true
# application.properties
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
# ----------------------------------------
# HIKARI PROPERTIES
# ----------------------------------------
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.pool-name=HikariCorePool
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
# ----------------------------------------
# DOCS PROPERTIES
# ----------------------------------------
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=false

