spring:
  application:
    name: cc-app-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cc_app_db}
    username: ${DB_USERNAME:cc_app}
    password: ${DB_PASSWORD:cc_app_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

firebase:
  auth:
    enabled: ${FIREBASE_AUTH_ENABLED:false}
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
  project-id: ${FIREBASE_PROJECT_ID:}

security:
  internal-api-key: ${INTERNAL_API_KEY:}

identity:
  refresh-token:
    ttl-hours: ${REFRESH_TOKEN_TTL_HOURS:720}

psp:
  jawupay:
    hmac-secret: ${JAWUPAY_HMAC_SECRET:change-me}
    replay-window-seconds: ${JAWUPAY_REPLAY_WINDOW_SECONDS:300}
    callback-rate-limit-per-minute: ${JAWUPAY_RATE_LIMIT_PER_MINUTE:60}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.ccapp: ${LOG_LEVEL_CCAPP:INFO}
