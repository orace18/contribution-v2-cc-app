springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

firebase.auth.enabled=${FIREBASE_AUTH_ENABLED:true}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase/firebase-service-account-prod.json}
firebase.project-id=${FIREBASE_PROJECT_ID:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.ccapp=${LOG_LEVEL_CCAPP:INFO}
logging.file.name=${LOG_FILE:logs/cc-app-backend.log}
logging.logback.rollingpolicy.file-name-pattern=${LOG_ROLLING_PATTERN:logs/archive/cc-app-backend.%d{yyyy-MM-dd}.%i.log.gz}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE:20MB}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY_DAYS:30}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP:2GB}
logging.logback.rollingpolicy.clean-history-on-start=true
