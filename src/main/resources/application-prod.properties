server.port=8080
server.servlet.context-path=/cc-app-backend
spring.application.name=cc-app-backend
management.security.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/club_chretien_prod_db?createDatabaseIfNotExist=true&useSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
firebase.path=
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.main.allow-bean-definition-overriding=true
debug=true
spring.mail.host=mail28.lwspanel.com
spring.mail.username=info@clubchretien.org
spring.mail.password=${MAIL_PASSWORD}
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
dsn=${SENTRY_DSN}
spring.neo4j.uri=${NEO4J_URL}
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.activemq.broker-url=tcp://activemq:61616
ACTIVEMQ_URL=tcp://activemq:61616
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
fraisInscription=0
fraisMaintenance=0
kitDemarrageAgent=0
kitDemarrageMarchand=0
