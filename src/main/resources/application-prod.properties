# CPass
cpass.enabled=true
cpass.client-id=${CPASS_CLIENT_ID}
cpass.client-secret=${CPASS_CLIENT_SECRET}
cpass.otp.supports-whatsapp=true

# Phone verification
identity.phone-verification.ttl-seconds=600

server.port=8080
server.servlet.context-path=/cc-backend-monolitic
spring.application.name=cc-backend-monolitic
management.security.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/club_chretien_v2_prod_db?createDatabaseIfNotExist=true&useSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.main.allow-bean-definition-overriding=true
debug=true
spring.mail.host=mail28.lwspanel.com
spring.mail.username=noreply@clubchretien.org
spring.mail.password=${MAIL_PASSWORD}
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.auth=true
dsn=${SENTRY_DSN}
spring.neo4j.uri=${NEO4J_URL}
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.activemq.broker-url=tcp://activemq:61616
ACTIVEMQ_URL=tcp://activemq:61616
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
partner.api.key=${PARTNER_API_KEY}

server.max-http-header-size=65536
