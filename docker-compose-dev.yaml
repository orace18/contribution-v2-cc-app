services:
  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev

      - DB_PORT=5432
      - DB_HOST=${DATABASE_URL}
      - DB_USER=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}

      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-admin-jwt-dev-secret}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-admin-bootstrap-dev-password}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-api-key-dev}
      - JAWUPAY_HMAC_SECRET=${JAWUPAY_HMAC_SECRET:-jawupay-hmac-dev-secret}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-classpath:firebase/firebase-service-account-dev.json}
      - PARTNER_API_KEY=${PARTNER_API_KEY:-partner-api-key-dev}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-bB9-6KZZ7UG9NxW}
      - SENTRY_DSN=${SENTRY_DSN}
      - ACTIVEMQ_USER=${ACTIVEMQ_USER}
      - ACTIVEMQ_PASSWORD=${ACTIVEMQ_PASSWORD:-admin}

      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOG_LEVEL_CCAPP=${LOG_LEVEL_CCAPP:-DEBUG}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - MEDIA_STORAGE_ENDPOINT=${MEDIA_STORAGE_ENDPOINT:-http://minio:9000}
      - MEDIA_STORAGE_REGION=${MEDIA_STORAGE_REGION:-us-east-1}
      - MEDIA_STORAGE_ACCESS_KEY=${MEDIA_STORAGE_ACCESS_KEY:-minioadmin}
      - MEDIA_STORAGE_SECRET_KEY=${MEDIA_STORAGE_SECRET_KEY:-minioadmin}
      - MINIO_URL=${MINIO_URL}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MEDIA_STORAGE_PATH_STYLE=${MEDIA_STORAGE_PATH_STYLE:-true}
      - MEDIA_BUCKET_PUBLIC=${MEDIA_BUCKET_PUBLIC:-cc-media-public}
      - MEDIA_BUCKET_PRIVATE=${MEDIA_BUCKET_PRIVATE:-cc-media-private}
      - MEDIA_BUCKET_KYC=${MEDIA_BUCKET_KYC:-cc-media-kyc}
      - MEDIA_BUCKET_AUTO_CREATE=${MEDIA_BUCKET_AUTO_CREATE:-true}
      - MEDIA_STORAGE_STARTUP_STRICT=${MEDIA_STORAGE_STARTUP_STRICT:-false}
      - MEDIA_UPLOAD_URL_TTL_MINUTES=${MEDIA_UPLOAD_URL_TTL_MINUTES:-15}
      - MEDIA_DOWNLOAD_URL_TTL_MINUTES=${MEDIA_DOWNLOAD_URL_TTL_MINUTES:-15}
      - MEDIA_MAX_SIZE_BYTES=${MEDIA_MAX_SIZE_BYTES:-10485760}

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.cc-app-backend-dev.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/${CI_PROJECT_NAME}`)"
      - "traefik.http.routers.cc-app-backend-dev.entrypoints=websecure"
      - "traefik.http.routers.cc-app-backend-dev.tls.certresolver=myresolver"
      - "traefik.http.services.cc-app-backend-dev.loadbalancer.server.port=${APP_PORT}"
      - "traefik.http.routers.cc-app-backend-dev.middlewares=cc-app-backend-dev-strip,cc-app-backend-dev-addctx"
      - "traefik.http.middlewares.cc-app-backend-dev-strip.stripprefix.prefixes=/${CI_PROJECT_NAME}"
      - "traefik.http.middlewares.cc-app-backend-dev-addctx.addprefix.prefix=/cc-app-backend"
      - "traefik.http.routers.cc-app-backend-dev-docs.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/cc-app-backend/v3/api-docs`) || PathPrefix(`/cc-app-backend/swagger-ui`) || Path(`/cc-app-backend/swagger-ui.html`))"
      - "traefik.http.routers.cc-app-backend-dev-docs.entrypoints=websecure"
      - "traefik.http.routers.cc-app-backend-dev-docs.tls.certresolver=myresolver"
      - "traefik.http.routers.cc-app-backend-dev-docs.service=cc-app-backend-dev"

    networks:
      - traefik_net
      - pgsql_net
      - club_chretien_net

networks:
  traefik_net:
    external: true
  pgsql_net:
    external: true
  club_chretien_net:
    external: true
