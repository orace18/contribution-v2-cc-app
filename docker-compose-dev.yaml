services:
  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev

      - DB_PORT=5432
      - DB_HOST=${DATABASE_URL}
      - DB_USER=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}

      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JAWUPAY_HMAC_SECRET=${JAWUPAY_HMAC_SECRET}
      - FIREBASE_AUTH_ENABLED=${FIREBASE_AUTH_ENABLED:-false}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}

      - LOG_LEVEL_ROOT=${LOG_LEVEL_ROOT:-INFO}
      - LOG_LEVEL_CCAPP=${LOG_LEVEL_CCAPP:-DEBUG}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      - "traefik.http.routers.cc-app-backend-dev.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/${CI_PROJECT_NAME}`)"
      - "traefik.http.routers.cc-app-backend-dev.entrypoints=websecure"
      - "traefik.http.routers.cc-app-backend-dev.tls.certresolver=myresolver"
      - "traefik.http.services.cc-app-backend-dev.loadbalancer.server.port=${APP_PORT}"
      - "traefik.http.routers.cc-app-backend-dev.middlewares=cc-app-backend-dev-strip,cc-app-backend-dev-addctx"
      - "traefik.http.middlewares.cc-app-backend-dev-strip.stripprefix.prefixes=/${CI_PROJECT_NAME}"
      - "traefik.http.middlewares.cc-app-backend-dev-addctx.addprefix.prefix=/cc-app-backend"
      - "traefik.http.routers.cc-app-backend-dev-docs.rule=Host(`${API_DOMAIN}`) && (PathPrefix(`/cc-app-backend/v3/api-docs`) || PathPrefix(`/cc-app-backend/swagger-ui`) || Path(`/cc-app-backend/swagger-ui.html`))"
      - "traefik.http.routers.cc-app-backend-dev-docs.entrypoints=websecure"
      - "traefik.http.routers.cc-app-backend-dev-docs.tls.certresolver=myresolver"
      - "traefik.http.routers.cc-app-backend-dev-docs.service=cc-app-backend-dev"

    networks:
      - traefik_net
      - pgsql_net
      - club_chretien_net

networks:
  traefik_net:
    external: true
  pgsql_net:
    external: true
  club_chretien_net:
    external: true
