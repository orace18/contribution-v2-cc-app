services:
  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "9901:8080"

    environment:
      - SPRING_PROFILES_ACTIVE=prod

      - DB_PORT=${DATABASE_PORT_PROD}
      - DB_HOST=${DATABASE_URL_PROD}
      - DB_USER=${DATABASE_USER_PROD}
      - DB_PASSWORD=${DATABASE_PASSWORD_PROD}

      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}

      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-admin-jwt-prod-change-me}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-admin-bootstrap-prod-change-me}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-api-key-prod-change-me}
      - JAWUPAY_HMAC_SECRET=${JAWUPAY_HMAC_SECRET:-jawupay-hmac-prod-change-me}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-classpath:firebase/firebase-service-account-prod.json}
      - PARTNER_API_KEY=${PARTNER_API_KEY:-partner-api-key-prod-change-me}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-bB9-6KZZ7UG9NxW}
      - SENTRY_DSN=${SENTRY_DSN}
      - ACTIVEMQ_USER=${ACTIVEMQ_USER}
      - ACTIVEMQ_PASSWORD=${ACTIVEMQ_PASSWORD:-activemq-prod-change-me}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      - MEDIA_STORAGE_ENDPOINT=${MEDIA_STORAGE_ENDPOINT:-http://minio:9000}
      - MEDIA_STORAGE_REGION=${MEDIA_STORAGE_REGION:-us-east-1}
      - MEDIA_STORAGE_ACCESS_KEY=${MEDIA_STORAGE_ACCESS_KEY:-minio-prod-change-me}
      - MEDIA_STORAGE_SECRET_KEY=${MEDIA_STORAGE_SECRET_KEY:-minio-prod-change-me}
      - MINIO_URL=${MINIO_URL}
      - MINIO_USER=${MINIO_USER}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MEDIA_STORAGE_PATH_STYLE=${MEDIA_STORAGE_PATH_STYLE:-true}
      - MEDIA_BUCKET_PUBLIC=${MEDIA_BUCKET_PUBLIC:-cc-media-public}
      - MEDIA_BUCKET_PRIVATE=${MEDIA_BUCKET_PRIVATE:-cc-media-private}
      - MEDIA_BUCKET_KYC=${MEDIA_BUCKET_KYC:-cc-media-kyc}
      - MEDIA_BUCKET_AUTO_CREATE=${MEDIA_BUCKET_AUTO_CREATE:-true}
      - MEDIA_STORAGE_STARTUP_STRICT=${MEDIA_STORAGE_STARTUP_STRICT:-false}
      - MEDIA_UPLOAD_URL_TTL_MINUTES=${MEDIA_UPLOAD_URL_TTL_MINUTES:-15}
      - MEDIA_DOWNLOAD_URL_TTL_MINUTES=${MEDIA_DOWNLOAD_URL_TTL_MINUTES:-15}
      - MEDIA_MAX_SIZE_BYTES=${MEDIA_MAX_SIZE_BYTES:-10485760}

    networks:
      - club_chretien_net

networks:
  club_chretien_net:
    external: true
