openapi: 3.0.3
info:
  title: Club Chretien Business Prayer API
  version: 1.0.0-draft
  description: |
    OpenAPI-first MVP contract for the Business Prayer module.

    Scope covered:
    - prayer feed
    - user prayer requests
    - prayer detail
    - Amen
    - support / "I prayed for this person"
    - comments
    - daily prayer
    - streak and missions dashboard
    - admin official posts
    - admin daily prayer publication

servers:
  - url: /
    description: Relative controller paths inside the monolith

tags:
  - name: Prayer Mobile
    description: Mobile prayer feed, interactions, daily prayer, and dashboard
  - name: Prayer Admin Posts
    description: Admin management of official prayer feed posts
  - name: Prayer Admin Daily
    description: Admin management of daily prayer content

security:
  - bearerAuth: []

paths:
  /api/mobile/prayers/feed:
    get:
      tags:
        - Prayer Mobile
      operationId: getPrayerFeed
      summary: List visible prayer feed items
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: includeMinePrivate
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Prayer feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerFeedEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/requests:
    post:
      tags:
        - Prayer Mobile
      operationId: createPrayerRequest
      summary: Publish a prayer request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrayerRequest'
      responses:
        '200':
          description: Prayer request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerPostEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/posts/{postId}:
    get:
      tags:
        - Prayer Mobile
      operationId: getPrayerPost
      summary: Get a visible prayer post detail
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Prayer post detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerPostEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/posts/{postId}/amen:
    put:
      tags:
        - Prayer Mobile
      operationId: recordPrayerAmen
      summary: Record an Amen reaction on a visible post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Amen recorded or already present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerInteractionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/posts/{postId}/support:
    put:
      tags:
        - Prayer Mobile
      operationId: recordPrayerSupport
      summary: Record an "I prayed for this person" reaction on a visible request post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Support recorded or already present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerInteractionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/posts/{postId}/comments:
    get:
      tags:
        - Prayer Mobile
      operationId: listPrayerComments
      summary: List comments for a visible prayer post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Prayer comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerCommentPageEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Prayer Mobile
      operationId: createPrayerComment
      summary: Add a comment to a visible prayer post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrayerCommentRequest'
      responses:
        '200':
          description: Prayer comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerCommentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/daily/current:
    get:
      tags:
        - Prayer Mobile
      operationId: getCurrentDailyPrayer
      summary: Get the current published daily prayer
      parameters:
        - $ref: '#/components/parameters/TimezoneParam'
      responses:
        '200':
          description: Current daily prayer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPrayerEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/daily/current/complete:
    post:
      tags:
        - Prayer Mobile
      operationId: completeCurrentDailyPrayer
      summary: Record completion of today's daily prayer
      parameters:
        - $ref: '#/components/parameters/TimezoneParam'
      requestBody:
        required: false
        description: >
          Optional explicit response type for the daily prayer. If omitted, the backend defaults
          to `PRAYED` for backward compatibility with earlier generic completion clients.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteDailyPrayerRequest'
      responses:
        '200':
          description: Daily prayer completed for the local day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPrayerCompletionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/mobile/prayers/dashboard:
    get:
      tags:
        - Prayer Mobile
      operationId: getPrayerDashboard
      summary: Get current prayer streak, missions, and engagement stats
      parameters:
        - $ref: '#/components/parameters/TimezoneParam'
      responses:
        '200':
          description: Prayer dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrayerDashboardEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/posts:
    get:
      tags:
        - Prayer Admin Posts
      operationId: listAdminPrayerPosts
      summary: List official prayer posts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PrayerPostLifecycleStatus'
        - name: visibility
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdminOfficialVisibilityScope'
      responses:
        '200':
          description: Official prayer posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrayerPostPageEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Prayer Admin Posts
      operationId: createAdminPrayerPost
      summary: Create an official prayer post draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreatePrayerPostRequest'
      responses:
        '200':
          description: Official prayer post created as draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrayerPostEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/posts/{postId}:
    get:
      tags:
        - Prayer Admin Posts
      operationId: getAdminPrayerPost
      summary: Get an official prayer post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Official prayer post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrayerPostEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    patch:
      tags:
        - Prayer Admin Posts
      operationId: updateAdminPrayerPost
      summary: Update an official prayer post draft
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdatePrayerPostRequest'
      responses:
        '200':
          description: Official prayer post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrayerPostEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/posts/{postId}/publish:
    post:
      tags:
        - Prayer Admin Posts
      operationId: publishAdminPrayerPost
      summary: Publish an official prayer post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Official prayer post published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrayerPostEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/posts/{postId}/archive:
    post:
      tags:
        - Prayer Admin Posts
      operationId: archiveAdminPrayerPost
      summary: Archive an official prayer post
      parameters:
        - $ref: '#/components/parameters/PostIdParam'
      responses:
        '200':
          description: Official prayer post archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPrayerPostEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/daily:
    get:
      tags:
        - Prayer Admin Daily
      operationId: listAdminDailyPrayers
      summary: List daily prayer records
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DailyPrayerStatus'
      responses:
        '200':
          description: Daily prayer records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyPrayerPageEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags:
        - Prayer Admin Daily
      operationId: createAdminDailyPrayer
      summary: Create a daily prayer draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateDailyPrayerRequest'
      responses:
        '200':
          description: Daily prayer draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyPrayerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/daily/{dailyPrayerId}:
    get:
      tags:
        - Prayer Admin Daily
      operationId: getAdminDailyPrayer
      summary: Get a daily prayer record
      parameters:
        - $ref: '#/components/parameters/DailyPrayerIdParam'
      responses:
        '200':
          description: Daily prayer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyPrayerEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    patch:
      tags:
        - Prayer Admin Daily
      operationId: updateAdminDailyPrayer
      summary: Update a daily prayer draft
      parameters:
        - $ref: '#/components/parameters/DailyPrayerIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateDailyPrayerRequest'
      responses:
        '200':
          description: Daily prayer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyPrayerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/daily/{dailyPrayerId}/publish:
    post:
      tags:
        - Prayer Admin Daily
      operationId: publishAdminDailyPrayer
      summary: Publish a daily prayer record
      parameters:
        - $ref: '#/components/parameters/DailyPrayerIdParam'
      responses:
        '200':
          description: Daily prayer published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyPrayerEnvelope'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /api/admin/prayers/daily/{dailyPrayerId}/archive:
    post:
      tags:
        - Prayer Admin Daily
      operationId: archiveAdminDailyPrayer
      summary: Archive a daily prayer record
      parameters:
        - $ref: '#/components/parameters/DailyPrayerIdParam'
      responses:
        '200':
          description: Daily prayer archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDailyPrayerEnvelope'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PostIdParam:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DailyPrayerIdParam:
      name: dailyPrayerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimezoneParam:
      name: timezone
      in: query
      required: false
      description: IANA timezone identifier used for local-day streak and mission resolution.
      schema:
        type: string
        example: Africa/Porto-Novo

  responses:
    BadRequestResponse:
      description: Validation or business-rule error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    UnauthorizedResponse:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    ForbiddenResponse:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    NotFoundResponse:
      description: Resource not found or not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    ConflictResponse:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    TooManyRequestsResponse:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'
    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonErrorResponse'

  schemas:
    CommonErrorResponse:
      type: object
      required:
        - success
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: Stable machine-readable error code for prayer endpoints.
          example: PRAYER_POST_NOT_FOUND
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

    PrayerVisibilityScope:
      type: string
      enum:
        - PRIVATE
        - CIRCLE
        - CHURCH
        - COMMUNITY
        - GLOBAL

    AdminOfficialVisibilityScope:
      type: string
      enum:
        - CHURCH
        - COMMUNITY
        - GLOBAL

    PrayerPostType:
      type: string
      enum:
        - REQUEST
        - OFFICIAL

    PrayerPostLifecycleStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
        - MODERATED
        - DELETED

    DailyPrayerStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED

    PrayerInteractionType:
      type: string
      enum:
        - AMEN
        - SUPPORT

    PrayerAuthorType:
      type: string
      enum:
        - ACCOUNT_HOLDER
        - ADMIN_PLATFORM

    PrayerDailyPrayerResponseType:
      type: string
      enum:
        - PRAYED
        - AMEN

    DailyMissionCode:
      type: string
      enum:
        - READ_DAILY_PRAYER
        - SUPPORT_ONE_REQUEST
        - COMMENT_ONE_POST

    DailyMissionStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - EXPIRED

    DeepLinkRouteKey:
      type: string
      enum:
        - PRAYER_DAY
        - PRAYER_FEED
        - WALLET_HOME
        - WALLET_FUND
        - STORE_HOME
        - MEMBERSHIP_PLANS
        - FINANCING_HOME
        - NOTIFICATION_CENTER

    MediaUsageType:
      type: string
      enum:
        - COVER
        - INLINE
        - AUDIO
        - ATTACHMENT

    PrayerAuthorResponse:
      type: object
      required:
        - displayName
        - authorType
      properties:
        accountHolderId:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
          example: Esther Doe
        authorType:
          $ref: '#/components/schemas/PrayerAuthorType'
        avatarMediaId:
          type: string
          format: uuid
          nullable: true

    PrayerScopeContext:
      type: object
      properties:
        audienceCircleId:
          type: string
          format: uuid
          nullable: true
        audienceChurchRef:
          type: string
          nullable: true
          example: church:paroisse-sainte-famille
        audienceCountryCode:
          type: string
          nullable: true
          example: BJ

    PrayerMediaRefResponse:
      type: object
      required:
        - mediaFileId
        - usageType
        - sortOrder
      properties:
        mediaFileId:
          type: string
          format: uuid
        usageType:
          $ref: '#/components/schemas/MediaUsageType'
        sortOrder:
          type: integer
          minimum: 0
        contentType:
          type: string
          nullable: true
          example: image/jpeg
        downloadUrl:
          type: string
          format: uri
          nullable: true

    InternalDeepLinkResponse:
      type: object
      required:
        - routeKey
        - params
      properties:
        routeKey:
          $ref: '#/components/schemas/DeepLinkRouteKey'
        label:
          type: string
          nullable: true
          example: Ouvrir mon wallet
        params:
          type: object
          additionalProperties:
            type: string
          example:
            source: business-prayer

    PrayerStatsResponse:
      type: object
      required:
        - amenCount
        - supportCount
        - commentCount
      properties:
        amenCount:
          type: integer
          minimum: 0
        supportCount:
          type: integer
          minimum: 0
        commentCount:
          type: integer
          minimum: 0

    PrayerViewerStateResponse:
      type: object
      required:
        - hasAmened
        - hasSupported
        - canAmen
        - canSupport
        - canComment
      properties:
        hasAmened:
          type: boolean
        hasSupported:
          type: boolean
        canAmen:
          type: boolean
        canSupport:
          type: boolean
        canComment:
          type: boolean

    PrayerPostResponse:
      type: object
      required:
        - id
        - postType
        - lifecycleStatus
        - content
        - visibility
        - author
        - stats
        - viewerState
        - createdAt
