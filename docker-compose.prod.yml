services:
  spring-app:
    image: ${IMAGE_FULL}
    container_name: ${CI_PROJECT_NAME}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${APP_PORT:-8080}

      DB_PORT: ${DATABASE_PORT_PROD}
      DB_HOST: ${DATABASE_URL_PROD}
      DB_USER: ${DATABASE_USER_PROD}
      DB_PASSWORD: ${DATABASE_PASSWORD_PROD}
      DB_URL: jdbc:postgresql://${DATABASE_URL_PROD}:${DATABASE_PORT_PROD}/${DATABASE_NAME_PROD:-cc_app_db}
      DB_USERNAME: ${DATABASE_USER_PROD}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JAWUPAY_HMAC_SECRET: ${JAWUPAY_HMAC_SECRET}
      FIREBASE_AUTH_ENABLED: ${FIREBASE_AUTH_ENABLED:-true}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/opt/app/secrets/firebase-service-account-prod.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}

      NEO4J_URL: ${NEO4J_URL:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_CCAPP: ${LOG_LEVEL_CCAPP:-INFO}
      LOG_FILE: ${LOG_FILE:-/var/log/cc-app/cc-app-backend.log}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY_DAYS: ${LOG_MAX_HISTORY_DAYS:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
    ports:
      - "${HOST_PORT_PROD:-9901}:${APP_PORT:-8080}"
    volumes:
      - ${APP_LOG_DIR:-./logs}:/var/log/cc-app
      - ${FIREBASE_CREDENTIALS_DIR:-./secrets}:/opt/app/secrets:ro
    restart: unless-stopped
    networks:
      - club_chretien_net

networks:
  club_chretien_net:
    external: true
